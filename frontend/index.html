    <script>
      (function () {
        var currentUrl = new URL(window.location.href);
        var redirectedPath = currentUrl.searchParams.get('__spa_redirect');

        if (redirectedPath === null) {
          return;
        }

        var basePath = currentUrl.pathname.replace(/\/+$/, '');
        var nextUrl = redirectedPath ? basePath + redirectedPath : currentUrl.pathname;
        window.history.replaceState(null, '', nextUrl);
      })();
    </script>
