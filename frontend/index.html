    <script>
      // Apply theme immediately to prevent flash of wrong theme
      (function () {
        var stored = localStorage.getItem('gridlock_theme');
        var theme = (stored === 'dark' || stored === 'light') ? stored
          : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <script>
      (function () {
        var currentUrl = new URL(window.location.href);
        var redirectedPath = currentUrl.searchParams.get('__spa_redirect');

        if (redirectedPath === null) {
          return;
        }

        var basePath = currentUrl.pathname.replace(/\/+$/, '');
        var nextUrl = redirectedPath ? basePath + redirectedPath : currentUrl.pathname;
        window.history.replaceState(null, '', nextUrl);
      })();
    </script>

    <script type="application/ld+json">

        {
          "@type": "Question",
          "name": "How to play dots and boxes?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Players take turns drawing lines between dots on a grid. When you complete the fourth side of a box, you claim it and go again. The player with the most boxes when the grid is full wins. Play free at GridLock — no download needed."
          }
        },
        {
          "@type": "Question",
          "name": "Can I play dots and boxes online with friends?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes! GridLock lets you play real-time multiplayer dots and boxes with 2-4 players. Create a game, share the room code, and your friends can join instantly from any browser."
          }
        },
        {
          "@type": "Question",
          "name": "Is GridLock free to play?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "GridLock is 100% free with no ads, no downloads, and no account required. Just open your browser and start playing."
          }
        },
        {
          "@type": "Question",
          "name": "What game modes does GridLock offer?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "GridLock offers multiplayer (2-4 players), play vs CPU (easy/medium/hard), daily challenges, ranked matches, and tournaments. Choose grid sizes from 3×3 to 6×6."
          }
        }
      ]
    }
