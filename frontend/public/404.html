<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GridLock</title>
    <script>
      (function () {
        // Keep /GridLock/ when deployed to GitHub Pages project site.
        // Keep /GridLock/beta/ for beta deploy URLs.
        var pathSegmentsToKeep = 1;
        var loc = window.location;
        var pathSegments = loc.pathname.split('/');
        var keepSegments =
          pathSegments.length > 2 && pathSegments[2] === 'beta'
            ? pathSegmentsToKeep + 1
            : pathSegmentsToKeep;

        var basePath = pathSegments.slice(0, keepSegments + 1).join('/') + '/';
        var routePath = '/' + pathSegments.slice(keepSegments + 1).join('/');
        if (routePath === '/') {
          routePath = '';
        }

        var route = routePath + loc.search + loc.hash;
        var target = basePath + '?p=' + encodeURIComponent(route);
        loc.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
