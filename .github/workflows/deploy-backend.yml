name: Deploy Backend to EC2

on:
  # Manual dispatch only — production deploys require DJ approval via #prod-deploys
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Backend Tests
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup-node is retained on self-hosted to pin the Node version,
      # ensure a consistent PATH, and guarantee the correct npm version
      # — the system-installed Node may drift from what CI expects.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --runInBand --forceExit

  deploy:
    name: Deploy to EC2
    runs-on: self-hosted
    needs: test
    environment: production
    steps:
      # TODO: This SSH-to-localhost step is redundant on self-hosted — the
      # runner already runs on the same EC2 instance. A follow-up should
      # replace this with direct local execution (run: ./scripts/deploy-backend.sh)
      # to eliminate the SSH key dependency and reduce latency.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            # ── Path assumptions ──────────────────────────────────────
            # These paths assume the EC2 directory structure:
            #   ~/projects/GridLock       — dev/build worktree (scripts live here)
            #   ~/projects/GridLock-prod  — production clone (deploy target)
            # See INFRASTRUCTURE.md for the full layout.
            # ──────────────────────────────────────────────────────────

            # Update deploy scripts from dev worktree first
            cd ~/projects/GridLock
            git fetch origin main
            git checkout main
            git pull origin main

            # Run the deploy script against the dedicated prod directory
            ./scripts/deploy-backend.sh
