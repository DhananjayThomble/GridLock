name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --runInBand --forceExit

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: test
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            # ── Path assumptions ──────────────────────────────────────
            # These paths assume the EC2 directory structure:
            #   ~/projects/GridLock       — dev/build worktree (scripts live here)
            #   ~/projects/GridLock-prod  — production clone (deploy target)
            # See INFRASTRUCTURE.md for the full layout.
            # ──────────────────────────────────────────────────────────

            # Update deploy scripts from dev worktree first
            cd ~/projects/GridLock
            git fetch origin main
            git checkout main
            git pull origin main

            # Run the deploy script against the dedicated prod directory
            ./scripts/deploy-backend.sh
