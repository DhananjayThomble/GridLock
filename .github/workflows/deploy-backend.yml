name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --runInBand --forceExit

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: test
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd ~/GridLock
            git fetch origin main
            git checkout main
            git pull origin main

            cd backend
            npm ci --production

            pm2 reload gridlock-backend --update-env || pm2 start server.js --name gridlock-backend

            sleep 3
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/health)
            if [ "$HTTP_CODE" != "200" ]; then
              echo "❌ Health check failed (HTTP $HTTP_CODE)"
              pm2 logs gridlock-backend --lines 20 --nostream
              exit 1
            fi
            echo "✅ Deployment successful — health check passed"
