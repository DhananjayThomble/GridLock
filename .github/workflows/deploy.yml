# Test, build and deploy on every push to main (prod) or develop (beta).
#
# Everything heavy (tests, npm ci, Vite build, Chromium prerendering) runs on
# GitHub-hosted runners. The 1GB server only receives a pre-built frontend
# tarball and runs `npm ci --omit=dev` + `pm2 reload` for the backend, through
# an SSH key that is locked to scripts/server-deploy.sh.
#
# Only runs on pushes to this repo's branches, never on pull requests, so
# fork PRs can't reach the deploy secrets. Setup: INFRASTRUCTURE.md → Deploying.
name: Deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy ${{ github.ref_name == 'main' && 'production' || 'beta' }}
    needs: ci
    if: github.repository == 'DhananjayThomble/GridLock'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'beta' }}
    env:
      TARGET: ${{ github.ref_name == 'main' && 'prod' || 'beta' }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - name: Check deploy secrets
        id: cfg
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::warning::DEPLOY_HOST secret not set — skipping deploy (see INFRASTRUCTURE.md)"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.enabled == 'true'

      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.enabled == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        if: steps.cfg.outputs.enabled == 'true'
        run: bash scripts/build-frontend.sh "$TARGET"
        env:
          # Optional — Sentry / PostHog stay off unless these are set
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_URL: ${{ vars.SENTRY_URL }}

      - name: Configure SSH
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: Deploy backend
        if: steps.cfg.outputs.enabled == 'true'
        run: ssh "$DEPLOY_USER@$DEPLOY_HOST" "backend $TARGET"

      - name: Deploy frontend
        if: steps.cfg.outputs.enabled == 'true'
        run: tar -C frontend/dist -czf - . | ssh "$DEPLOY_USER@$DEPLOY_HOST" "frontend $TARGET"
