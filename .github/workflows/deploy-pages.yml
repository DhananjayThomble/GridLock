name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build production (base /GridLock/)
        run: npm run build
        working-directory: frontend
        env:
          GITHUB_ACTIONS: true
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL }}

      - name: Build beta (base /GridLock/beta/)
        run: npx vite build --base=/GridLock/beta/ --outDir=dist-beta --emptyOutDir
        working-directory: frontend
        env:
          GITHUB_ACTIONS: true
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL }}

      - name: Assemble Pages artifact
        run: |
          mkdir -p pages-out/beta
          # Production build → /GridLock/ (root of Pages site)
          cp -r frontend/dist/. pages-out/
          # Beta build → /GridLock/beta/
          cp -r frontend/dist-beta/. pages-out/beta/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
