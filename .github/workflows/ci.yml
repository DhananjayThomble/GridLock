# Pull-request checks for contributors.
#
# Runs on GitHub-hosted runners only. This repo is public: never switch these
# jobs to `self-hosted`, or code from fork PRs would run on our servers.
# `pull_request` (not `pull_request_target`) gives fork PRs a read-only token
# and no secrets.
name: CI

on:
  pull_request:
    branches: [develop, main]
  # Pushes to develop/main run these checks via deploy.yml before deploying
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test -- --forceExit
        working-directory: backend
        env:
          # Point the test suite at the mongo:7 service container above instead
          # of spawning a per-suite in-memory mongod (which timed out beforeAll
          # hooks under --runInBand). See backend/__tests__/setup/mongoTestServer.js.
          MONGO_URI: mongodb://localhost:27017/gridlock-test

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
