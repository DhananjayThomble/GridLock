name: CI

on:
  push:
    branches: [ develop, 'feature/**', 'bugfix/**', 'hotfix/**', 'fix/**', 'feat/**' ]
  pull_request:
    branches: [ develop, main ]

jobs:
  # ── Job 1: Backend unit tests (Jest only — no integration/socket tests) ──────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (Jest)
        run: npm test -- --runInBand --forceExit

  # ── Job 2: Frontend lint + build ────────────────────────────────────────────
  frontend-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (before build — dist dirs don't exist yet)
        run: npm run lint --if-present

      - name: Build (production — /GridLock/ base for GitHub Pages)
        run: npm run build
        env:
          VITE_BASE_PATH: /GridLock/
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL }}

      - name: Build (beta — /GridLock/beta/ base for GitHub Pages)
        run: npx vite build --base=/GridLock/beta/ --outDir=dist-beta --emptyOutDir
        env:
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: |
            frontend/dist
            frontend/dist-beta
          retention-days: 1

  # ── Job 3: E2E tests (browser interaction) ──────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [ backend-test, frontend-build ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install root dependencies (Playwright runner)
        run: npm ci

      - name: Install Playwright + Chromium
        run: npx playwright install chromium --with-deps

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Start backend server
        run: node server.js &
        working-directory: backend
        env:
          PORT: 5000
          NODE_ENV: test

      - name: Wait for backend to be ready
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:5000/health && break
            echo "Waiting for backend... ($i)"
            sleep 2
          done

      - name: Build frontend for E2E (base=/ for vite preview)
        run: npm run build
        working-directory: frontend

      - name: Run E2E tests
        run: npx playwright test --config=playwright.config.js
        env:
          CI: true
          TEST_BASE_URL: http://localhost:4173

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: test-results/
          retention-days: 7
