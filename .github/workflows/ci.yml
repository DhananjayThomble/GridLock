name: CI

on:
  push:
    branches: [ develop, 'feature/**', 'bugfix/**', 'hotfix/**' ]
  pull_request:
    branches: [ develop, main ]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

      - name: Lint
        run: npm run lint --if-present

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: npm run build

      - name: Build (beta)
        run: npx vite build --base=/beta/ --outDir=dist-beta --emptyOutDir
        env:
          NODE_ENV: production

      - name: Lint
        run: npm run lint --if-present

      - name: Smoke test (Playwright)
        run: |
          npm install --save-dev playwright
          npx playwright install chromium --with-deps
          npx vite preview --port 4173 &
          sleep 4
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push(e.message));
            await page.goto('http://localhost:4173/', { waitUntil: 'networkidle', timeout: 15000 });
            const root = await page.locator('#root').innerHTML().catch(() => '');
            const text = await page.locator('body').innerText().catch(() => '');
            await browser.close();
            if (root.trim().length < 10 || errors.length > 0 || !text.includes('Dots')) {
              console.error('SMOKE FAILED — blank screen or JS errors:', errors.join('; '));
              process.exit(1);
            }
            console.log('✅ Smoke test passed — lobby renders correctly');
          })();"
