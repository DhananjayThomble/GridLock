name: CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop, main ]

jobs:
  # ── Job 1: Backend unit tests (Jest only — no integration/socket tests) ──────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (Jest)
        run: npm test -- --runInBand --forceExit

  # ── Job 2: Frontend lint + build ────────────────────────────────────────────
  frontend-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (before build — dist dirs don't exist yet)
        run: npm run lint --if-present

      - name: Build (production — /GridLock/ base for GitHub Pages)
        run: npm run build
        env:
          VITE_BASE_PATH: /GridLock/
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL }}

      - name: Build (beta — /GridLock/beta/ base for GitHub Pages)
        run: npx vite build --base=/GridLock/beta/ --outDir=dist-beta --emptyOutDir
        env:
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: |
            frontend/dist
            frontend/dist-beta
          retention-days: 1

  # E2E tests removed from CI — run locally before opening PRs:
  #   npm run test:e2e:local
