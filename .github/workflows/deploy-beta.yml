name: Deploy Beta to EC2

on:
  push:
    branches:
      - develop
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/deploy-beta.yml'
  workflow_dispatch:

concurrency:
  group: beta-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Beta
    runs-on: ubuntu-latest
    environment: beta
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            # ── Pull latest develop ──
            cd ~/projects/GridLock-beta
            git fetch origin develop
            git checkout develop
            git reset --hard origin/develop

            # ── Deploy backend (port 5001, separate DB) ──
            cd backend
            npm ci --production
            MONGO_URI=mongodb://localhost:27017/gridlock_beta PORT=5001 \
              pm2 reload gridlock-beta-backend --update-env || \
              MONGO_URI=mongodb://localhost:27017/gridlock_beta PORT=5001 \
              pm2 start ~/projects/GridLock-beta/backend/server.js --name gridlock-beta-backend

            sleep 2
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5001/health)
            if [ "$HTTP_CODE" != "200" ]; then
              echo "❌ Beta backend health check failed (HTTP $HTTP_CODE)"
              pm2 logs gridlock-beta-backend --lines 10 --nostream
              exit 1
            fi
            echo "✅ Beta backend deployed (port 5001)"

            # ── Build & deploy frontend ──
            cd ~/projects/GridLock-beta/frontend
            npm ci
            VITE_BASE_PATH=/ \
            VITE_SOCKET_URL=https://beta-gridlock.snapurl.in \
            VITE_API_BASE_URL=https://beta-gridlock.snapurl.in \
            VITE_SITE_URL=https://beta-gridlock.snapurl.in \
            npm run build

            sudo rm -rf /var/www/gridlock-beta/*
            sudo cp -r dist/. /var/www/gridlock-beta/
            sudo chown -R www-data:www-data /var/www/gridlock-beta/

            pm2 save

            echo "✅ Beta deployment complete (frontend + backend)"
