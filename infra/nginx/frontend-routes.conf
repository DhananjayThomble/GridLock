# Include inside the frontend server block. Keep existing API/socket proxy
# locations and headers. Use this in place of the catch-all SPA location.
error_page 404 /404.html;

location = /app.html {
    internal;
}

location = /404.html {
    internal;
}

# Utility routes and dynamic links need the SPA, with noindex in its HTML.
location ~ ^/(game|history|tournament|settings|replays|admin|auth/setup|join/[^/]+|waiting/[^/]+|profile/[^/]+|replay/[^/]+|play/[^/]+)/?$ {
    try_files /app.html =404;
}

# Serve static assets and prerendered public pages. Preserve genuine 404s.
location / {
    absolute_redirect off;
    try_files $uri $uri/ =404;
}
